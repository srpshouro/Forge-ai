name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Forge AI" com.forge.aicode --web-dir=www
          npx cap add android
          npx cap sync android
          cp android/app/build.gradle /tmp/build.gradle.orig
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.orig
      - name: File permission and fixed signing key
        continue-on-error: true
        run: |
          sed -i -e 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          if [ -f forge.p12 ] && keytool -list -storetype PKCS12 -keystore forge.p12 -storepass forge123 > /dev/null 2>&1; then
            sed -i '0,/^android {/s#^android {#android {\n    signingConfigs {\n        debug {\n            storeFile file("../../forge.p12")\n            storePassword "forge123"\n            keyAlias "forge"\n            keyPassword "forge123"\n            storeType "pkcs12"\n        }\n    }#' android/app/build.gradle
          else
            echo "forge.p12 missing or unreadable, using the default debug key"
          fi
      - name: App icon
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            pip install -q --break-system-packages pillow
            python3 - <<'PY'
          from PIL import Image
          import os
          im = Image.open('icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          for k, (a, f) in {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}.items():
              p = res + '/mipmap-' + k
              if not os.path.isdir(p):
                  continue
              im.resize((a, a), Image.LANCZOS).save(p + '/ic_launcher.png')
              im.resize((a, a), Image.LANCZOS).save(p + '/ic_launcher_round.png')
              im.resize((f, f), Image.LANCZOS).save(p + '/ic_launcher_foreground.png')
          v = res + '/values/ic_launcher_background.xml'
          if os.path.exists(v):
              open(v, 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0B0D12</color></resources>')
          PY
          fi
      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || { echo "Retrying with default settings"; cp /tmp/build.gradle.orig app/build.gradle; cp /tmp/AndroidManifest.orig app/src/main/AndroidManifest.xml; ./gradlew assembleDebug --no-daemon; }
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeAI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
