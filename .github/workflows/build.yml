name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project from index.html
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Forge AI" com.forge.aicode --web-dir=www
          npx cap add android
          sed -i -e 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          if [ -f forge.p12 ]; then sed -i '0,/^android {/s#^android {#android {\n    signingConfigs {\n        debug {\n            storeFile file("../../forge.p12")\n            storePassword "forge123"\n            keyAlias "forge"\n            keyPassword "forge123"\n            storeType "pkcs12"\n        }\n    }#' android/app/build.gradle; fi
          npx cap sync android
      - name: App icon
        if: hashFiles('icon.png') != ''
        continue-on-error: true
        run: |
          mkdir -p assets && cp icon.png assets/icon-only.png && cp icon.png assets/icon-foreground.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0d12' --iconBackgroundColorDark '#0b0d12'
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeAI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
